apiVersion: v1
kind: Namespace
metadata:
  name: stratus
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stratus-data
  namespace: stratus
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 500Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratus
  namespace: stratus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stratus
  template:
    metadata:
      labels:
        app: stratus
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: stratus
          image: ghcr.io/OWNER/stratus:latest
          ports:
            - containerPort: 4100
          env:
            - name: MAX_CONCURRENT_SESSIONS
              value: "100"
            - name: BROWSER_HOUR_ALLOWANCE
              value: "500"
            - name: STRATUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stratus-secrets
                  key: api-key
            - name: PUBLIC_BASE_URL
              value: https://stratus.example.com
          resources:
            requests:
              cpu: "32"
              memory: 64Gi
            limits:
              cpu: "64"
              memory: 128Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /ready
              port: 4100
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4100
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stratus-data
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: stratus
  namespace: stratus
spec:
  selector:
    app: stratus
  ports:
    - port: 80
      targetPort: 4100
