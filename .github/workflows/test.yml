name: Test

# This repository shipped an unreachable final submit control to production because nothing ran
# its tests on a pull request. The only check was a Vercel build, which proves the app compiles
# and nothing about whether it can still click Submit on an employer form. Every suite below
# already existed and already passed locally. The gap was that no one had to run them.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    # 35, and the reason is the suite's own size rather than any one change in it: a unit suite of
    # 257 plus five replay harnesses that each drive a real browser against a fixture server, plus
    # an e2e pass.
    #
    # The chronology matters, because one of the cancellations below is at 30 minutes and would
    # otherwise read as evidence that 35 is also too small:
    #
    #   1. cancelled at 30m15s, WITH the cap already at 30 and BEFORE any reduction.
    #   2. the replay scripts then got LITOS_POST_SUBMIT_SETTLE_MS, which took the managed-runner
    #      replay from about 9 minutes to 1m53s.
    #   3. the cap was reverted to 20 on the theory that the reduction had paid for it. It had not:
    #      runs were then cancelled at 20m07s and 20m15s on two separate heads.
    #
    # So the post-reduction suite measures about 25 minutes, which is more than 20 and less than the
    # 30 that failed pre-reduction. 35 is that 25 plus enough headroom that a slow runner does not
    # cancel a passing run, and still short enough to catch a genuine hang. A cap is a ceiling, not
    # a reservation: raising it costs nothing on a run that passes.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # THE DOM SUITES AND THE END TO END RUN NEED TWO DIFFERENT BROWSERS, and the first version of
      # this workflow only provided one, which is why its first green-CI run reported 76 failures.
      #
      # The DOM suites call chromium.launch() with no executablePath, so they need Playwright's own
      # matched build. playwright-core ships the browser downloader but not the browser, hence this
      # step. test/e2e.mjs is the other case: it launches with config.chromePath, which is what the
      # Resolve Chrome step below supplies.
      # CACHED, BECAUSE A HANGING DOWNLOAD COSTS THE WHOLE JOB. Twice on 2026-08-19 this step hung
      # and the job was cancelled at the 35-minute cap with the failure attributed here, which reads
      # as a test failure and is not one: the same suite had passed in 21m38s hours earlier. The
      # cache key is the lockfile, so a playwright-core bump re-downloads and nothing else does.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # A STEP CAP AS WELL AS THE CACHE. The cache stops the usual case; this stops a cold miss on a
      # bad CDN day from eating the job budget and reporting a hang as a red suite.
      #
      # NO --with-deps, AND THAT IS THE THIRD TIME THIS STEP'S BUDGET WAS MEASURED WRONG. Six
      # minutes fired on a healthy cold install because apt ran past it; twelve then fired too
      # (2026-08-19, 18:46 UTC run): the mirror served fonts-ipafont-gothic, 3.5 MB, in five
      # minutes and the cap expired before the browser download even started. That run's own apt
      # log is also the proof the apt half is not needed here: every shared library --with-deps
      # asked for was "already the newest version" on the runner image, because the image ships
      # Chrome and Chromium with their libraries, and the only NEW packages were nine font packs
      # for scripts no suite renders or asserts on. So the step now downloads only the browser,
      # which is the one thing the image genuinely lacks and the one thing the cache covers. If
      # the image ever drops a library, this does not fail silently: chromium.launch() in the very
      # first DOM suite refuses with Playwright's missing-dependency message naming this step.
      #
      # Six minutes is four times the measured ~90 second download, and a cache hit spends
      # seconds. The apt lottery is out of the number now, so the number can be honest again.
      - name: Install Playwright Chromium
        timeout-minutes: 6
        run: node node_modules/playwright-core/cli.js install chromium

      # The GitHub Ubuntu image already carries Google Chrome, so resolve it rather than downloading
      # a third copy. Fail loudly if it is ever absent: a silently skipped browser suite is how an
      # untested chooser reached production in the first place.
      - name: Resolve Chrome
        run: |
          for candidate in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$candidate" ]; then
              echo "CHROME_EXECUTABLE_PATH=$candidate" >> "$GITHUB_ENV"
              echo "Using $candidate"
              "$candidate" --version
              exit 0
            fi
          done
          echo "No Chrome or Chromium binary found on this runner." >&2
          exit 1

      # Each suite runs on its own step so a failure names the pathway that broke instead of
      # collapsing into one red "verify". These are the same commands `npm run verify` chains.
      - name: Unit and DOM suites
        run: npm test

      - name: Managed runner replay
        run: npm run test:runner

      - name: Choice parity replay
        run: npm run test:choice-parity

      - name: Security code replay
        run: npm run test:security-code

      - name: Required confirmation replay
        run: npm run test:required-confirmation

      # The producer half of the cross-repo captcha contract. It has to run HERE rather than only
      # locally: the file it pins is committed byte-identical in student-outreach-backend, and a
      # change to this runner's extract handling that the backend is not expecting is precisely the
      # class of drift a pull request has to catch.
      - name: Captcha visibility contract
        run: npm run test:captcha-visibility

      # The keystroke that used to hand the applicant a correctly filled form covered in red. It is
      # a replay rather than a unit test because the defect lives in the press branch of the runner,
      # not in the rule it calls, and a rule a test can reach is not a rule production calls.
      - name: Enter validation replay
        run: npm run test:enter-validation

      - name: Transport containment replay
        run: npm run test:transport-containment

      - name: Browser end to end
        run: npm run test:e2e

      - name: Upload end to end evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: /tmp/stratus-e2e-*
          if-no-files-found: ignore
          retention-days: 7
